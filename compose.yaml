services:
  postgres:
    image: postgres:16
    container_name: trinity-postgres
    environment:
      POSTGRES_DB: banca
      POSTGRES_USER: banca
      POSTGRES_PASSWORD: banca_dev_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banca -d banca"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: trinity-banca
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banca
    ports:
      - "8080:8080"

volumes:
  postgres_data:
